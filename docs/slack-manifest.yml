# Paste this into https://api.slack.com/apps → Create New App → "From a manifest"
# Socket Mode app, no public URL needed.
display_information:
  name: Foody
  description: Group food ordering for your team — react with emojis to build a shared cart.
  background_color: "#FF6B35"

features:
  bot_user:
    display_name: Foody
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # Slack AI apps: the split-pane assistant surface (suggested prompts, status,
  # thread context). Powers the natural-language ordering flow in assistant.ts.
  assistant_view:
    assistant_description: >-
      Tell Foody what the team is hungry for — it finds restaurants near you,
      checks menus and prices, and kicks off an emoji-reaction group order in
      your channel.

oauth_config:
  scopes:
    bot:
      # Read messages in channels where the bot is invited + DMs to the bot
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      # Post messages, threads, blocks
      - chat:write
      # Pre-react to the menu message + receive reaction events
      - reactions:read
      - reactions:write
      # Read minimal user info for the address book greeting
      - users:read
      # AI assistant pane: set status, title, suggested prompts
      - assistant:write

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
      # AI assistant pane lifecycle
      - assistant_thread_started
      - assistant_thread_context_changed
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
